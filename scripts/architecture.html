<figure class="mech arch">
  <svg viewBox="0 0 960 300" role="img" aria-label="The velocity network: the interpolated state and the one-hot mask are concatenated and projected to width 256, pass through four residual blocks whose layer norms are scaled and shifted by an embedding of the time t, and a final layer norm and linear layer output a velocity for all 51 coordinates, of which only the generated ones enter the loss.">
    <defs>
      <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
      </marker>
    </defs>
    <!-- time path -->
    <rect x="20" y="30" width="60" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="50" y="52" font-size="13" text-anchor="middle" font-style="italic">t</text>
    <line x1="80" y1="47" x2="118" y2="47" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <rect x="122" y="30" width="150" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="197" y="52" font-size="12" text-anchor="middle">sinusoidal embedding (256)</text>
    <line x1="272" y1="47" x2="310" y2="47" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <rect x="314" y="30" width="110" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="369" y="52" font-size="12" text-anchor="middle">MLP, SiLU (256)</text>
    <line x1="424" y1="47" x2="560" y2="47" stroke="currentColor" stroke-width="1.5"/>
    <line x1="560" y1="47" x2="560" y2="98" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <text x="574" y="80" font-size="11" class="mech-sub">scale, shift per block</text>
    <!-- inputs -->
    <rect x="20" y="150" width="110" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="75" y="166" font-size="12" text-anchor="middle">state z<tspan baseline-shift="sub" font-size="9">t</tspan> (51)</text>
    <text x="75" y="178" font-size="10" text-anchor="middle" class="mech-sub">absent coords set to 0</text>
    <rect x="20" y="222" width="110" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="75" y="238" font-size="12" text-anchor="middle">mask one-hot</text>
    <text x="75" y="250" font-size="10" text-anchor="middle" class="mech-sub">3 × 51 = 153</text>
    <line x1="130" y1="167" x2="170" y2="195" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <line x1="130" y1="239" x2="170" y2="211" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <rect x="174" y="186" width="98" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="223" y="202" font-size="12" text-anchor="middle">concat (204)</text>
    <text x="223" y="214" font-size="10" text-anchor="middle" class="mech-sub">linear → 256</text>
    <line x1="272" y1="203" x2="310" y2="203" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <!-- residual block (expanded) -->
    <rect x="314" y="104" width="492" height="150" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="326" y="122" font-size="12" font-weight="600">residual block, × 4</text>
    <rect x="330" y="186" width="84" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="372" y="207" font-size="11" text-anchor="middle">LayerNorm</text>
    <line x1="414" y1="203" x2="432" y2="203" stroke="currentColor" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <rect x="436" y="186" width="118" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="495" y="202" font-size="11" text-anchor="middle">(1 + scale) · h + shift</text>
    <text x="495" y="214" font-size="10" text-anchor="middle" class="mech-sub">from t</text>
    <line x1="554" y1="203" x2="572" y2="203" stroke="currentColor" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <rect x="576" y="186" width="70" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="611" y="207" font-size="11" text-anchor="middle">linear 256</text>
    <line x1="646" y1="203" x2="664" y2="203" stroke="currentColor" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <rect x="668" y="186" width="46" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="691" y="207" font-size="11" text-anchor="middle">SiLU</text>
    <line x1="714" y1="203" x2="732" y2="203" stroke="currentColor" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <rect x="736" y="186" width="56" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="764" y="203" font-size="11" text-anchor="middle">linear</text>
    <text x="764" y="214" font-size="9" text-anchor="middle" class="mech-sub">zero-init</text>
    <!-- skip connection -->
    <path d="M322 203 L322 240 L800 240 L800 203" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
    <circle cx="800" cy="203" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="800" y="207" font-size="11" text-anchor="middle">+</text>
    <text x="561" y="254" font-size="10" text-anchor="middle" class="mech-sub">skip connection</text>
    <!-- output -->
    <line x1="806" y1="203" x2="836" y2="203" stroke="currentColor" stroke-width="1.5" marker-end="url(#arch-arrow)"/>
    <rect x="840" y="168" width="100" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="890" y="190" font-size="11" text-anchor="middle">LayerNorm</text>
    <text x="890" y="204" font-size="11" text-anchor="middle">linear → 51</text>
    <text x="890" y="222" font-size="12" text-anchor="middle" font-style="italic">velocity v<tspan baseline-shift="sub" font-size="9">t</tspan></text>
    <text x="890" y="262" font-size="10" text-anchor="middle" class="mech-sub">loss on generated</text>
    <text x="890" y="274" font-size="10" text-anchor="middle" class="mech-sub">coordinates only</text>
  </svg>
  <figcaption>The velocity network. The state and the one-hot mask enter together; the time enters through scale and shift parameters inside each block; the output is a velocity for every coordinate, but only the generated coordinates are trained and moved. About 1.3 million parameters.</figcaption>
</figure>
